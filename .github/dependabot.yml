# A `make static-vuln` (trivy, govulncheck) MEGMONDJA, ha egy függőségben sebezhetőség van, de nem
# emeli a verziót. A Dependabot PR-t nyit rá, amire lefut a teljes CI, tehát látszik, tör-e valamit.
version: 2

# A Go modulok a PRIVÁT github.com/lipcsei/commons-t húzzák: a Dependabot a saját tokenjével nem éri
# el, így a gomod-frissítések e nélkül elakadnak. A COMMONS_READ_TOKEN egy csak a commons repót
# OLVASÓ (fine-grained, Contents: read) token, a repó DEPENDABOT-titkai között - nem az Actions-
# titkok között, azokat a Dependabot nem látja:
#   gh secret set COMMONS_READ_TOKEN --app dependabot
registries:
  commons:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.COMMONS_READ_TOKEN}}

updates:
  - package-ecosystem: gomod
    registries:
      - commons
    directory: /services/account
    schedule:
      interval: weekly
      day: monday
    # Egy frissen kiadott verzió ne kerüljön be azonnal: a kompromittált kiadások jellemzően
    # napokon belül kiderülnek és visszavonják őket.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # A golang.org/x/* csomagok együtt mozognak; külön PR-ekben csak egymásra várnának.
      golang-x:
        patterns: ["golang.org/x/*"]

  - package-ecosystem: npm
    directories: [/admin, /landing]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # A fejlesztői eszközök (linter, típusok, build) nem kerülnek a bundle-be, ezért egy PR-ben
      # is átnézhetők.
      dev-tooling:
        dependency-type: development
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  # A Dockerfile-ok alapképei (golang, node, nginx) és a workflow-k actionjei is elöregednek.
  - package-ecosystem: docker
    directories: [/admin, /landing, /services/account]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # A SHA-ra rögzített actionöket a sor végi `# v5` megjegyzés alapján frissíti.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
