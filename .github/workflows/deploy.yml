# Automatikus kitelepítés a VPS-re, minden sikeres main-ági CI után.
#
# A titkok (jelszavak, kliens secret) forrása a VPS_ENV GitHub secret -
# ez a deploy/.env.prod.example alapján kitöltött fájl TELJES tartalma.
# Minden kitelepítéskor ez írja felül a szerveren a deploy/.env.prod-ot,
# tehát egy jelszó cseréjéhez elég a GitHub secretet frissíteni és a
# workflow-t (újra)futtatni - nem kell SSH-n szerkeszteni semmit.
#
# A "snitt-cloud-prod" environment beállításai (Settings → Environments),
# lásd docs/VPS-TELEPITES.md. Változó (Environment variables) VAGY secret
# lehet, mert nem titok:
#   VPS_HOST        a szerver IP-je vagy hostneve
#   VPS_USER        a deploy felhasználó (NE root)
#   VPS_SSH_PORT    opcionális, alapértelmezés 22
# Csak SECRET lehet (a változó sima szövegként tárolódik és naplózódik; a
# workflow hibával leáll, ha változóként találja):
#   VPS_SSH_KEY     a deploy felhasználóhoz tartozó PRIVÁT kulcs (ed25519)
#   VPS_ENV         a deploy/.env.prod fájl teljes, kitöltött tartalma

name: Deploy VPS

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Kézi újrafuttatás: a VPS_ENV frissítése után, vagy push nélküli újratelepítéshez.
  workflow_dispatch:

# Két deploy soha ne fusson egyszerre (ugyanazokért a konténerekért versenyeznének).
concurrency:
  group: deploy-snitt-cloud
  cancel-in-progress: false

jobs:
  # A kitelepítés lépései KÖZÖSEK: a lipcsei/workflows repó deploy-vps.yml workflow-ja végzi (ott van
  # leírva, mit csinál és mire figyel). Itt csak az áll, MIKOR fusson és MIVEL.
  deploy:
    # Piros CI-ból soha nem megy ki semmi élesre.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: lipcsei/workflows/.github/workflows/deploy-vps.yml@v1
    secrets: inherit
    with:
      app: snitt-cloud
      environment: snitt-cloud-prod
      # A compose-fájlok és a .env.prod a deploy/ könyvtárban vannak.
      compose_dir: deploy
      # A "landing" szándékosan hiányzik: az GitHub Pages-en fut. A Keycloak a megosztott sso repóban,
      # a 80/443 a megosztott edge proxyban él - azoknak saját deploy workflow-juk van, és ELŐBB kell
      # futniuk, mint ennek (sso -> edge -> ez), mert a konténereink az ő hálózataikra csatlakoznak.
      services: postgres account admin
      required_networks: sso-net edge-net
      log_services: account admin
