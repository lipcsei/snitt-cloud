# Snitt-specific English strings. Keycloak's own English messages are the
# baseline; only what would sound generic - or where we want the product name
# and tone - is overridden here.
#
# Keycloak reads theme message files as UTF-8 (unlike Java's .properties
# default), so accented characters can be written directly.

loginAccountTitle=Sign in to Snitt
doLogIn=Sign in
doRegister=Create account

registerTitle=Create account
registerWithTitle=Create account
noAccount=No account yet?
backToLogin=Back to sign in

emailForgotTitle=Forgotten password
doForgotPassword=Forgot your password?

usernameOrEmail=Username or email
password=Password
rememberMe=Keep me signed in
