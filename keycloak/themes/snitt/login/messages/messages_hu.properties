# Snitt-specifikus magyar szövegek. A Keycloak saját magyar fordítása adja az
# alapot; itt csak azt írjuk felül, ami generikusan hangzana, vagy amiben a
# termék nevét/hangnemét akarjuk viszontlátni.
#
# A Keycloak a téma-üzenetfájlokat UTF-8-ként olvassa (eltérően a Java
# .properties alapértelmezésétől), ezért az ékezetes betűk írhatók közvetlenül.

# "Sign in to your account" -> a termék nevével
loginAccountTitle=Belépés a Snittbe
doLogIn=Belépés
doRegister=Fiók létrehozása

# A regisztráció célja nálunk szűkebb, mint általában:
registerTitle=Fiók létrehozása
registerWithTitle=Fiók létrehozása
noAccount=Még nincs fiókod?
backToLogin=Vissza a belépéshez

# A jelszó-emlékeztető szövegei
emailForgotTitle=Elfelejtett jelszó
doForgotPassword=Elfelejtetted a jelszavad?

usernameOrEmail=Felhasználónév vagy e-mail
password=Jelszó
rememberMe=Maradjak bejelentkezve
