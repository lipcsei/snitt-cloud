server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Egyoldalas alkalmazás: minden ismeretlen útvonal az index.html-t kapja,
    # különben a /felhasznalok újratöltése 404 lenne.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A hasheléssel verziózott assetek végtelen ideig cache-elhetők, az
    # index.html viszont soha - különben egy deploy után a régi bundle maradna.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
