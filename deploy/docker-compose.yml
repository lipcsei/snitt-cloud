# Snitt felhő oldali fejlesztői stack: Postgres + account szolgáltatás.
# Indítás a repo gyökeréből:  docker compose -f deploy/docker-compose.yml up --build
#
# Minden rész saját konténerben fut, ahogy élesben is:
#
#   postgres :5432   adatbázis
#   account  :8090   API (Go)
#   admin    :5175   belső admin felület (nginx + SPA)
#   landing  :8088   marketing oldal (nginx + SPA)
#
# A landing élesben GitHub Pagesre megy; ez a konténer a helyi
# megtekintéshez van, és a VALÓDI production buildet szolgálja ki (a Vite dev
# szerverrel szemben, ami a hoston `npm run dev`-vel indul).
#
# Keycloak és a hozzá tartozó Mailpit (fejlesztői e-mail mock) NEM ebben a
# stackben futnak - lásd https://github.com/lipcsei/sso: egyetlen Keycloak
# szolgáltatja mind ezt, mind a breath appot, saját adatbázissal. Azt a
# stacket kell ELŐSZÖR elindítani (`docker compose up -d` abban a repóban) -
# az hozza létre az "sso-net" hálózatot, amihez `account` lent csatlakozik.
# Enélkül ez a `docker compose up` "network sso-net declared as external,
# but could not be found" hibával elhasal.

name: snitt

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snitt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snitt}
      POSTGRES_DB: ${POSTGRES_DB:-snitt}
    ports:
      # Fejlesztői kényelem: psql/DB kliens a hostról is elérje.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snitt} -d ${POSTGRES_DB:-snitt}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  account:
    build:
      context: ../services/account
      dockerfile: Dockerfile
      # Az account service a privát github.com/lipcsei/commons modult is importálja (errtrack,
      # keycloak): a build ezen keresztül éri el az SSH-ügynököt (lásd services/account/Dockerfile).
      ssh: [default]
    environment:
      HTTP_ADDR: ":8090"
      DATABASE_URL: postgres://${POSTGRES_USER:-snitt}:${POSTGRES_PASSWORD:-snitt}@postgres:5432/${POSTGRES_DB:-snitt}?sslmode=disable
      # A tokenek issuer claimje az, amit a böngésző lát (localhost:8081), a
      # discovery viszont az sso-net hálózaton belülről, a "keycloak"
      # hoszton történik (lásd https://github.com/lipcsei/sso) - ezért a
      # két URL szándékosan eltér.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8081/realms/snitt}
      KEYCLOAK_DISCOVERY_URL: http://keycloak:8080/realms/snitt
      # Több kliens hívja ugyanezt az API-t, mindegyik a saját client id-jével
      # kap tokent - ezért az elfogadott audience-ek listája.
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-snitt-landing,snitt-admin}
      # A landing (5174) és az admin felület (5175) is innen hívja az API-t.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://localhost:5175}
      # A Keycloak Admin REST API az sso-net hálózaton belülről érhető el; a
      # service account innen olvassa a felhasználókat az admin felülethez.
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-snitt}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-snitt-admin-api}
      # Fejlesztői titok, a sso repó snitt-realm.json-jában ugyanez szerepel.
      # Éles környezetben felülírandó.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-snitt-admin-api-dev-secret}
      ADMIN_ROLE: ${ADMIN_ROLE:-admin}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-HUF}
      # Opcionális hibajelentés a GlitchTipbe; üres DSN = teljesen kikapcsolva.
      # Dockerben futó szolgáltatásnak a DSN-ben "localhost" helyett
      # "host.docker.internal" kell (lásd deploy/.env.example).
      SENTRY_DSN: ${SENTRY_DSN_ACCOUNT:-}
      SENTRY_ENVIRONMENT: development
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - sso-net

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        # A Vite fordításkor helyettesíti be ezeket, futásidőben már nem
        # módosíthatók - a VPS-re tehát más értékekkel kell újraépíteni a
        # képet (lásd admin/README.md).
        VITE_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-snitt}
        VITE_KEYCLOAK_CLIENT_ID: ${ADMIN_CLIENT_ID:-snitt-admin}
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8090}
        # Hibajelentés a GlitchTipbe (opcionális, üres DSN = kikapcsolva). Az
        # environmentet külön kell adni: a kép production módban épül, ami
        # magától "production"-t adna erre a fejlesztői példányra is.
        VITE_SENTRY_DSN: ${SENTRY_DSN_ADMIN:-}
        VITE_SENTRY_ENVIRONMENT: development
    ports:
      - "5175:80"
    depends_on:
      - account
    restart: unless-stopped

  landing:
    build:
      context: ../landing
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-snitt}
        VITE_KEYCLOAK_CLIENT_ID: ${LANDING_CLIENT_ID:-snitt-landing}
        # A kanonikus URL-ek és a hreflang ebből épülnek - élesben
        # https://snitt.video.
        SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8088}
        VITE_SENTRY_DSN: ${SENTRY_DSN_LANDING:-}
        VITE_SENTRY_ENVIRONMENT: development
    ports:
      - "8088:80"
    restart: unless-stopped

networks:
  default: {}
  # Owned by https://github.com/lipcsei/sso - lets `account` reach the
  # shared Keycloak container by name ("keycloak") for JWKS validation and
  # the Admin REST API.
  sso-net:
    external: true
    name: sso-net

volumes:
  postgres-data:
