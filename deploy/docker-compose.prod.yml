# Éles felülbírálás a docker-compose.yml fölé - VPS-en ezzel a kettővel
# együtt kell indítani, SOHA önmagában.
#
# Használat (a repo gyökeréből, a VPS-en):
#   docker compose --env-file deploy/.env.prod \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml \
#     up -d --build postgres account admin
#
# A "landing" szándékosan hiányzik a fenti listából: az élesben GitHub
# Pages-en fut (lásd .github/workflows/ci.yml), ezen a VPS-en nincs rá
# szükség - ha mégis felhoznád, csak dupla karbantartás és felesleges
# TLS-tanúsítvány lenne.
#
# A "keycloak" SEM szerepel a listában - az a megosztott sso stack saját
# szolgáltatása (lásd https://github.com/lipcsei/sso), azt külön kell
# telepíteni/indítani a VPS-en, ANNAK saját docker-compose.prod.yml-jével.
#
# A TLS-terminátor ("caddy") sincs itt: a 80/443-as portot egyetlen
# megosztott proxy kezeli MINDEN app helyett (lásd
# https://github.com/lipcsei/edge) - egy hoston egyszerre csak egy folyamat
# köthet rá. Ez a stack csak az "edge-net" hálózatra köti azokat a
# konténereket, amiket kívülről is el kell érni, egyedi aliassal
# (snitt-account, snitt-admin) - az edge proxy ezeken a neveken éri el őket.
# Indítási sorrend a VPS-en: sso -> edge -> ez.
#
# Mit csinál ez a fájl a fejlesztői composehoz képest:
#  - a Postgres/account/admin portjait 127.0.0.1-re köti: kifelé csak az
#    edge proxy nyit 80/443-at, TLS-sel - a nyers HTTP végpontok névvel ne
#    legyenek elérhetők a nyílt internetről.
#  - az account és az admin konténert az edge-net hálózatra köti.

services:
  postgres:
    # Élesben NINCS hosztport. A sima "ports:" listákat a compose EGYBEFŰZI
    # a docker-compose.yml bejegyzésével, ezért kell a "!reset". Az account
    # a belső hálózaton éri el (postgres:5432), a mentés "docker compose
    # exec"-kel megy. A 127.0.0.1:5432 ráadásul ütközne az sso Postgresével,
    # ami ugyanezen a gépen fut.
    ports: !reset []

  account:
    ports: !override
      - "127.0.0.1:8090:8090"
    networks:
      # A default és az sso-net a docker-compose.yml-ben már szerepel; a
      # compose az itteni bejegyzéssel EGYESÍTI őket, nem cseréli le.
      edge-net:
        aliases: [snitt-account]

  admin:
    ports: !override
      - "127.0.0.1:5175:80"
    networks:
      default: {}
      edge-net:
        aliases: [snitt-admin]

networks:
  # A https://github.com/lipcsei/edge stack hozza létre - előbb azt kell
  # elindítani.
  edge-net:
    external: true
    name: edge-net
